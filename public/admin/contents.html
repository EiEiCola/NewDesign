<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โพสต์ | Intranet CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-background font-sans text-slate-700 antialiased" data-page="contents">
    <div class="md:flex min-h-screen">
        <div class="md:hidden flex items-center justify-between bg-slate-900 text-white px-4 py-2">
            <span class="font-bold text-[14px]">Intranet CMS</span>
            <button id="nav-toggle" type="button" class="w-8 h-8" aria-label="เมนู"><i class="fa-solid fa-bars"></i></button>
        </div>
        <aside id="admin-nav" class="hidden md:flex flex-col w-full md:w-60 bg-slate-900 py-4 px-2 md:sticky md:top-0 md:h-screen flex-shrink-0"></aside>

        <main id="page" class="flex-1 min-w-0 p-4 md:p-6" hidden>
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <h1 class="text-xl font-bold text-slate-800" id="page-title">โพสต์</h1>
                <a href="content-edit.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> สร้างโพสต์</a>
            </div>

            <div class="bg-white border border-slate-200 rounded-lg">
                <form id="filters" class="flex flex-wrap items-end gap-3 p-3 border-b border-slate-100">
                    <label class="flex-1 min-w-[180px]"><span class="admin-label">ค้นหาหัวข้อ</span><input name="q" class="admin-input" placeholder="พิมพ์หัวข้อ..."></label>
                    <label class="w-56"><span class="admin-label">หมวดหมู่</span><select name="sc_id" class="admin-input"><option value="">ทั้งหมด</option></select></label>
                    <label class="w-36"><span class="admin-label">สถานะ</span>
                        <select name="status" class="admin-input">
                            <option value="">ทั้งหมด</option>
                            <option value="published">เผยแพร่</option>
                            <option value="draft">ร่าง</option>
                            <option value="hidden">ซ่อน</option>
                        </select>
                    </label>
                </form>
                <div class="overflow-x-auto">
                    <table class="w-full text-[13px]">
                        <thead class="bg-slate-50 text-slate-500 text-[12px]">
                            <tr>
                                <th class="text-left font-medium px-4 py-2">หัวข้อ</th>
                                <th class="text-left font-medium px-4 py-2">หมวดหมู่</th>
                                <th class="text-left font-medium px-4 py-2">สถานะ</th>
                                <th class="text-left font-medium px-4 py-2">ผู้โพสต์</th>
                                <th class="text-left font-medium px-4 py-2">เผยแพร่</th>
                                <th class="text-right font-medium px-4 py-2">เข้าชม</th>
                                <th class="px-4 py-2"></th>
                            </tr>
                        </thead>
                        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
                <div class="flex items-center justify-between gap-3 p-3 border-t border-slate-100">
                    <span id="count" class="text-[12px] text-slate-500"></span>
                    <div id="pager" class="flex items-center gap-1"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin/api.js"></script>
    <script src="../js/admin/layout.js"></script>
    <script src="../js/admin/contents.js"></script>
</body>
</html>
