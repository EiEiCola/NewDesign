<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit log | Intranet CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-background font-sans text-slate-700 antialiased" data-page="audit" data-role="admin">
    <div class="md:flex min-h-screen">
        <div class="md:hidden flex items-center justify-between bg-slate-900 text-white px-4 py-2">
            <span class="font-bold text-[14px]">Intranet CMS</span>
            <button id="nav-toggle" type="button" class="w-8 h-8" aria-label="เมนู"><i class="fa-solid fa-bars"></i></button>
        </div>
        <aside id="admin-nav" class="hidden md:flex flex-col w-full md:w-60 bg-slate-900 py-4 px-2 md:sticky md:top-0 md:h-screen flex-shrink-0"></aside>

        <main id="page" class="flex-1 min-w-0 p-4 md:p-6" hidden>
            <h1 class="text-xl font-bold text-slate-800 mb-4">Audit log</h1>

            <div class="bg-white border border-slate-200 rounded-lg">
                <form id="filters" class="flex flex-wrap items-end gap-3 p-3 border-b border-slate-100">
                    <label class="w-40"><span class="admin-label">การกระทำ</span><select name="action" class="admin-input"><option value="">ทั้งหมด</option></select></label>
                    <label class="w-36"><span class="admin-label">Username</span><input name="username" class="admin-input" placeholder="เช่น 2559001"></label>
                    <label class="flex-1 min-w-[160px]"><span class="admin-label">ค้นหาข้อความ</span><input name="q" class="admin-input" placeholder="เช่น ชื่อโพสต์"></label>
                    <label><span class="admin-label">จากวันที่</span><input type="date" name="from" class="admin-input"></label>
                    <label><span class="admin-label">ถึงวันที่</span><input type="date" name="to" class="admin-input"></label>
                    <button type="reset" class="btn btn-ghost">ล้าง</button>
                </form>
                <ul id="rows" class="divide-y divide-slate-100"></ul>
                <div class="flex items-center justify-between gap-3 p-3 border-t border-slate-100">
                    <span id="count" class="text-[12px] text-slate-500"></span>
                    <div id="pager" class="flex items-center gap-1"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin/api.js"></script>
    <script src="../js/admin/layout.js"></script>
    <script src="../js/admin/audit-log.js"></script>
</body>
</html>
