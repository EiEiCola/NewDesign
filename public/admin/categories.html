<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หมวดหมู่ | Intranet CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-background font-sans text-slate-700 antialiased" data-page="categories" data-role="admin">
    <div class="md:flex min-h-screen">
        <div class="md:hidden flex items-center justify-between bg-slate-900 text-white px-4 py-2">
            <span class="font-bold text-[14px]">Intranet CMS</span>
            <button id="nav-toggle" type="button" class="w-8 h-8" aria-label="เมนู"><i class="fa-solid fa-bars"></i></button>
        </div>
        <aside id="admin-nav" class="hidden md:flex flex-col w-full md:w-60 bg-slate-900 py-4 px-2 md:sticky md:top-0 md:h-screen flex-shrink-0"></aside>

        <main id="page" class="flex-1 min-w-0 p-4 md:p-6" hidden>
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div>
                    <h1 class="text-xl font-bold text-slate-800">หมวดหมู่</h1>
                    <p class="text-[12px] text-slate-500 mt-0.5">
                        <i class="fa-solid fa-grip-vertical text-slate-400"></i> จับลากเพื่อเรียงลำดับ (บันทึกอัตโนมัติ) ·
                        หมวดที่มีโพสต์ลบไม่ได้ ให้ปิดใช้งานแทน
                    </p>
                </div>
                <button type="button" id="btn-add-main" class="btn btn-primary"><i class="fa-solid fa-folder-plus"></i> เพิ่มหมวดหมู่</button>
            </div>

            <div class="bg-white border border-slate-200 rounded-lg">
                <div class="flex flex-wrap items-end justify-between gap-2 border-b border-slate-200 px-2">
                    <div id="side-tabs" class="flex" role="tablist"></div>
                    <div class="flex gap-1 py-2 pr-2">
                        <button type="button" id="btn-collapse-all" class="btn btn-ghost !px-2 !py-1" title="ย่อทั้งหมด"><i class="fa-solid fa-compress"></i> ย่อทั้งหมด</button>
                        <button type="button" id="btn-expand-all" class="btn btn-ghost !px-2 !py-1" title="ขยายทั้งหมด"><i class="fa-solid fa-expand"></i> ขยายทั้งหมด</button>
                    </div>
                </div>
                <p id="side-hint" class="px-4 pt-3 text-[12px] text-slate-500"></p>
                <div id="main-list" class="p-4 space-y-2"></div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="../js/admin/api.js"></script>
    <script src="../js/admin/layout.js"></script>
    <script src="../js/admin/categories.js"></script>
</body>
</html>
