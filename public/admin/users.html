<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผู้ใช้และสิทธิ์ | Intranet CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/tailwind-config.js"></script>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-background font-sans text-slate-700 antialiased" data-page="users" data-role="admin">
    <div class="md:flex min-h-screen">
        <div class="md:hidden flex items-center justify-between bg-slate-900 text-white px-4 py-2">
            <span class="font-bold text-[14px]">Intranet CMS</span>
            <button id="nav-toggle" type="button" class="w-8 h-8" aria-label="เมนู"><i class="fa-solid fa-bars"></i></button>
        </div>
        <aside id="admin-nav" class="hidden md:flex flex-col w-full md:w-60 bg-slate-900 py-4 px-2 md:sticky md:top-0 md:h-screen flex-shrink-0"></aside>

        <main id="page" class="flex-1 min-w-0 p-4 md:p-6" hidden>
            <div class="flex flex-wrap items-center justify-between gap-3 mb-1">
                <h1 class="text-xl font-bold text-slate-800">ผู้ใช้และสิทธิ์</h1>
                <button type="button" id="btn-add" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> เพิ่มผู้ใช้</button>
            </div>
            <p class="text-[12px] text-slate-500 mb-4">
                <b>ผู้ดูแลระบบ</b> จัดการได้ทุกอย่าง ·
                <b>ผู้โพสต์</b> สร้าง/แก้ไขโพสต์ของตัวเองได้ ·
                <b>ผู้ใช้ทั่วไป</b> ไม่มีสิทธิ์โพสต์
            </p>

            <div class="bg-white border border-slate-200 rounded-lg">
                <div class="p-3 border-b border-slate-100">
                    <div class="relative max-w-xs">
                        <input id="search" class="admin-input pr-8" placeholder="ค้นหา รหัสพนักงาน / ชื่อ / username">
                        <i class="fa-solid fa-magnifying-glass text-xs text-slate-400 absolute right-3 top-1/2 -translate-y-1/2"></i>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-[13px]">
                        <thead class="bg-slate-50 text-slate-500 text-[12px]">
                            <tr>
                                <th class="text-left font-medium px-4 py-2">รหัสพนักงาน</th>
                                <th class="text-left font-medium px-4 py-2">ชื่อ-นามสกุล</th>
                                <th class="text-left font-medium px-4 py-2">Username</th>
                                <th class="text-left font-medium px-4 py-2">สิทธิ์</th>
                                <th class="text-left font-medium px-4 py-2">สถานะ</th>
                                <th class="text-left font-medium px-4 py-2">เข้าระบบล่าสุด</th>
                                <th class="px-4 py-2"></th>
                            </tr>
                        </thead>
                        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin/api.js"></script>
    <script src="../js/admin/layout.js"></script>
    <script src="../js/admin/users.js"></script>
</body>
</html>
