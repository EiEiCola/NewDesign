<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirivatana Intranet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/rich-body.css">
</head>
<body class="bg-background font-sans text-slate-700 antialiased overflow-x-hidden flex flex-col h-screen overflow-hidden">

    <!-- Top Banner & Navigation -->
    <div class="w-full bg-slate-900 flex flex-col items-center sticky top-0 z-30 shadow-md">
        <div class="w-full max-w-[1400px] h-[90px] relative overflow-hidden bg-slate-900">
            <img src="images/siri_bg.gif" alt="Sirivatana Interprint PCL - Intranet" class="absolute inset-0 w-full h-full object-cover">
        </div>
        <div class="w-full max-w-[1400px] h-8 flex items-center justify-end gap-5 px-6 lg:px-8 bg-slate-900 border-t border-white/10">
            <nav class="flex gap-5 text-xs font-medium text-slate-300">
                <a href="index.html" class="hover:text-white transition-colors">Home</a><a href="#" class="hover:text-white transition-colors">Job Status</a><a href="marketing.html" class="hover:text-white transition-colors">Marketing</a><a href="announcements.html" class="hover:text-white transition-colors">ประกาศ</a><a href="#" class="hover:text-white transition-colors">Production</a><a href="#" class="hover:text-white transition-colors">Delivery</a>
            </nav>
            <a href="admin/login.html" id="login-link" class="flex items-center gap-1.5 px-3 py-0.5 bg-white/10 hover:bg-white hover:text-purple-900 text-white rounded border border-white/30 transition-all text-xs font-semibold">
                <i class="fa-solid fa-right-to-bracket text-[10px]"></i>
                <span>Login</span>
            </a>
        </div>
    </div>

    <div class="flex w-full max-w-[1400px] mx-auto flex-1 min-h-0 my-3 bg-white shadow-soft rounded-lg overflow-hidden border border-slate-200/60">

        <!-- Left Sidebar (filled by js/cms-public.js) -->
        <aside class="w-[240px] bg-surface flex-shrink-0 overflow-y-auto py-4 px-4 border-r border-slate-200">
            <div class="flex items-center gap-2 pb-2 mb-4 border-b border-slate-200 text-slate-500">
                <i class="fa-solid fa-folder-tree text-sm"></i>
                <span class="font-bold tracking-widest text-[11px] uppercase">Document</span>
            </div>
            <ul id="sidebar-left" class="space-y-1 text-[13px]">
                <li class="text-[12px] text-slate-400 px-2">กำลังโหลด...</li>
            </ul>
        </aside>

        <!-- Post detail -->
        <main class="flex-1 min-w-0 bg-white p-5 overflow-y-auto">
            <nav class="flex items-center gap-2 text-[11px] text-slate-400 mb-4 min-w-0" aria-label="breadcrumb">
                <a href="index.html" class="hover:text-primary">Home</a>
                <i class="fa-solid fa-chevron-right text-[8px]"></i>
                <span id="crumb-main"></span>
                <i class="fa-solid fa-chevron-right text-[8px]"></i>
                <a id="crumb-sub" href="#" class="hover:text-primary"></a>
            </nav>

            <article id="article" class="max-w-3xl">
                <p class="text-[13px] text-slate-400">กำลังโหลด...</p>
            </article>

            <footer class="pt-6 text-center text-[10px] text-slate-400">
                &copy; 2026 Sirivatana Intranet. All rights reserved.
            </footer>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/cms-public.js"></script>
    <script src="js/content.js"></script>
</body>
</html>
